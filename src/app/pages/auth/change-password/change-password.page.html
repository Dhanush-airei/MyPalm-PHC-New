<app-page-header
  [showBackButton]="showBackButton"
  [showLogo]="showLogo"
  [appTitle]="appTitle"
  [actions]="headerActions"
></app-page-header>

<ion-content fullscreen class="change-password-page">
  <div class="container py-4">
    <!-- Illustration -->
    <div class="text-center mb-4">
      <div class="password-icon">
        <img src="../../../../assets/img/password.svg" alt="Password" />
      </div>
    </div>

    <form [formGroup]="changePasswordForm">
      <!-- Old Password -->

      <!-- <div class="mb-4">
        <label class="form-label"> Old Password </label>

        <div class="input-group custom-input">
          <span class="input-group-text">
            <ion-icon name="lock-closed-outline"></ion-icon>
          </span>

          <input
            class="form-control"
            [type]="showOldPassword ? 'text' : 'password'"
            formControlName="oldPassword"
            placeholder="Enter old password"
          />

          <span
            class="input-group-text"
            (click)="showOldPassword=!showOldPassword"
          >
            <ion-icon
              [name]="showOldPassword ? 'eye-off-outline' : 'eye-outline'"
            >
            </ion-icon>
          </span>
        </div>
      </div> -->

      <!-- New Password -->

      <div class="mb-4">
        <label class="form-label">
          {{ 'CHANGEPASSWORD.newpassword' | translate}}
        </label>

        <div class="input-group custom-input">
          <span class="input-group-text">
            <ion-icon name="key-outline"></ion-icon>
          </span>

          <input
            class="form-control"
            [type]="showNewPassword ? 'text' : 'password'"
            formControlName="newPassword"
            placeholder="{{ 'CHANGEPASSWORD.placeholder' | translate}}"
          />

          <span
            class="input-group-text"
            (click)="showNewPassword=!showNewPassword"
          >
            <ion-icon
              [name]="showNewPassword ? 'eye-off-outline' : 'eye-outline'"
            >
            </ion-icon>
          </span>
        </div>
      </div>

      <!-- Confirm Password -->

      <div class="mb-5">
        <label class="form-label">
          {{ 'CHANGEPASSWORD.confirmpassword' | translate}}
        </label>

        <div class="input-group custom-input">
          <span class="input-group-text">
            <ion-icon name="shield-checkmark-outline"></ion-icon>
          </span>

          <input
            class="form-control"
            [type]="showConfirmPassword ? 'text' : 'password'"
            formControlName="confirmPassword"
            placeholder="{{ 'CHANGEPASSWORD.confirmplaceholder' | translate}}"
          />

          <span
            class="input-group-text"
            (click)="showConfirmPassword=!showConfirmPassword"
          >
            <ion-icon
              [name]="showConfirmPassword ? 'eye-off-outline' : 'eye-outline'"
            >
            </ion-icon>
          </span>
        </div>
      </div>

      <button
        type="button"
        class="btn btn-primary save-btn"
        [disabled]="isLoading"
        (click)="savePassword()"
      >
        @if (!isLoading) { {{ 'GENERALBUTTON.savebutton' | translate}} } @else {
        <ion-spinner color="light"></ion-spinner>
        }
      </button>
    </form>
  </div>
</ion-content>
