<ion-header>
  <ion-toolbar class="bg-brown-color">
    <ion-buttons slot="start">
      <ion-button color="light" (click)="btn_close()">
        <ion-icon icon="chevron-back-outline"></ion-icon>
        <span class="icontext">
          {{ 'MAINTENANCENOTIFICATIONVIEW.back' | translate}}</span
        >
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-content-bg">
  <div style="margin: 10px">
    <div class="bg-black text-white p-2 fs-14 text-center fw-bold">
      AI Based Predictive Maintenance Details
    </div>

    <div class="aicard">
      <div
        style="color: #ffffff; font-size: 14px"
        [innerHTML]="aicontent"
      ></div>
    </div>
  </div>
</ion-content>
