<ion-header>
  <ion-toolbar class="bg-brown-color">
    <ion-title mode="md" color="light">
      <div class="ion-text-wrap">
        {{ 'GRADINGHOME.updatenetweight' | translate}}
      </div>
    </ion-title>
  </ion-toolbar>
</ion-header>
<ion-content>
  <div class="content">
    <form class="home-box" [formGroup]="weighbridgeForm">
      <ion-row class="form-row">
        <ion-col size="5.5">
          <div class="title">{{ 'GRADINGHOME.netweight' | translate}} (MT)</div>
        </ion-col>

        <ion-col size="0.5" class="text-center">
          <div class="title">
            <b>:</b>
          </div>
        </ion-col>

        <ion-col size="6">
          <input
            type="number"
            class="h7 form-control"
            formControlName="txt_netweight"
            [placeholder]="'GENERALBUTTON.enter' | translate"
            (keypress)="decimalFilter($event)"
            (keydown)="onKeydown($event, 'done')"
          />
        </ion-col>
      </ion-row>

      <ion-row class="action-row">
        <ion-col class="action-col">
          <button
            type="button"
            class="cancelbutton"
            (click)="cancel()"
            aria-label="Cancel"
          ></button>
        </ion-col>

        <ion-col class="action-col">
          <button
            type="button"
            class="okaybutton"
            (click)="save()"
            aria-label="Save"
          ></button>
        </ion-col>
      </ion-row>
    </form>
  </div>
</ion-content>
