<ion-tabs>
  <ion-tab-bar slot="bottom">
    @for (tab of tabs; track tab.route) { @if (tab.visible) {

    <ion-tab-button [tab]="tab.route">
      <ion-icon [name]="tab.icon"></ion-icon>

      <ion-label> {{ tab.translationKey | translate }} </ion-label>
    </ion-tab-button>

    } }
  </ion-tab-bar>
</ion-tabs>
